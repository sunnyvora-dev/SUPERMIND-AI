version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-file:./prisma/dev.db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - BASE_URL=${BASE_URL:-https://api.scalemax.pro/token/v1}
      - SCALEMAX_API_KEY=${SCALEMAX_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - backend_uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: supermind_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - app_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  backend_uploads:
  redis_data:

networks:
  app_network:
    driver: bridge
