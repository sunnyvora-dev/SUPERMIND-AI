version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://supermind:supermind_secret@postgres:5432/supermind_db?schema=public
      - JWT_SECRET=supermind_production_jwt_secret_key_2026
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: supermind_postgres
    environment:
      POSTGRES_USER: supermind
      POSTGRES_PASSWORD: supermind_secret
      POSTGRES_DB: supermind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: supermind_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
